name: GitHub CI
on:
  # Build every pushed branch; artifacts are only uploaded for master and tags (see below)
  push:
    branches:
      - '**'
    # With only a branch filter, pushing a tag wouldn't start a build (and the release step below)
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches:
      - master
  release:
    types: released

jobs:
  build:
    name: Build
    runs-on: windows-latest
    # The release step needs to create the release; the default token is read-only
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Build each tfm separately since building all requires too much disk space
      - name: Build dnSpy (.NET Framework)
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          .\build.ps1 netframework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path C:\builtfiles -Force > $null
          Compress-Archive -Path dnSpy\dnSpy\bin\Release\net48\* -DestinationPath C:\builtfiles\dnSpy-netframework.zip
          # Release smoke test + decompiler regression test (Debug and Release builds of Test/DecompilerStress)
          .\Test\DecompilerStress\check-publish.ps1 -PublishDir dnSpy\dnSpy\bin\Release\net48
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\clean-all.cmd

      - name: Build dnSpy (.NET x86)
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          .\build.ps1 net-x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Release smoke test: the self-contained build must contain C# (ILSpy 11) and its console must pass the decompiler check
          .\Test\DecompilerStress\check-publish.ps1 -PublishDir dnSpy\dnSpy\bin\Release\net10.0-windows\win-x86\publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path C:\builtfiles -Force > $null
          Compress-Archive -Path dnSpy\dnSpy\bin\Release\net10.0-windows\win-x86\publish\* -DestinationPath C:\builtfiles\dnSpy-net-win32.zip
          .\clean-all.cmd

      - name: Build dnSpy (.NET x64)
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          .\build.ps1 net-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Release smoke test: the self-contained build must contain C# (ILSpy 11) and its console must pass the decompiler check
          .\Test\DecompilerStress\check-publish.ps1 -PublishDir dnSpy\dnSpy\bin\Release\net10.0-windows\win-x64\publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path C:\builtfiles -Force > $null
          Compress-Archive -Path dnSpy\dnSpy\bin\Release\net10.0-windows\win-x64\publish\* -DestinationPath C:\builtfiles\dnSpy-net-win64.zip
          .\clean-all.cmd

      # Visual Studio builds the Debug configuration, which can break independently of Release
      - name: Build dnSpy (Debug, .NET Framework)
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          msbuild -v:m -m -restore -t:Build -p:Configuration=Debug -p:TargetFramework=net48 dnSpy.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\clean-all.cmd

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: dnSpy-netframework
          path: C:\builtfiles\dnSpy-netframework.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: dnSpy-net-win32
          path: C:\builtfiles\dnSpy-net-win32.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: dnSpy-net-win64
          path: C:\builtfiles\dnSpy-net-win64.zip
          if-no-files-found: error

      # The release's notes: its section in CHANGELOG.md (## 7.x.y.z), then what's in each zip
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          # The version's section, and the version before it (the next section) for the Full Changelog link
          $section = @()
          $inSection = $false
          $previous = $null
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($line -match '^## ') {
              if ($inSection) { $previous = $line.Substring(3).Trim(); break }
              $inSection = $line.Substring(3).Trim() -eq $version
              continue
            }
            if ($inSection) { $section += $line }
          }
          $notes = ($section -join "`n").Trim()
          if (-not $notes) {
            # Pre-releases (v7.0.0-beta.1) don't need a section
            if (-not $version.Contains('-')) { Write-Error "CHANGELOG.md has no '## $version' section"; exit 1 }
            $notes = 'Pre-release.'
          }
          if ($previous) {
            $notes += "`n`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/v$previous...${{ github.ref_name }}"
          }
          $downloads = @(
            ''
            '### Downloads'
            ''
            '- `dnSpy-netframework.zip`: needs .NET Framework 4.8 (dnSpy.exe = 64-bit, dnSpy-x86.exe = 32-bit)'
            '- `dnSpy-net-win64.zip` / `dnSpy-net-win32.zip`: self-contained .NET 10, no runtime install needed'
            ''
            'dnSpy 7.3 and later can update themselves (Help > Check for Updates). If your antivirus software complains, it''s a false positive.'
          ) -join "`n"
          New-Item -ItemType Directory -Path C:\builtfiles -Force > $null
          Set-Content -Path C:\builtfiles\release-notes.md -Value ($notes + "`n" + $downloads) -Encoding utf8
          Get-Content C:\builtfiles\release-notes.md

      # Create a new release: create a tag, then 'git push origin <tagname>', wait for it to build
      - name: Create a new GitHub release if a new tag is pushed
        uses: softprops/action-gh-release@v2
        with:
          files: |
            C:\builtfiles\dnSpy-netframework.zip
            C:\builtfiles\dnSpy-net-win32.zip
            C:\builtfiles\dnSpy-net-win64.zip
          # Tags like v7.0.0-beta.1 are published as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: C:\builtfiles\release-notes.md
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
